name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Un job por paquete PHP (matriz): si falla el tutor, se ve cuál y los demás siguen.
  php:
    name: ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [packages/agent-core, apps/qa-evaluator, apps/tutor, apps/conciliacion]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar Laravel
        if: hashFiles(format('{0}/artisan', matrix.dir)) != ''
        run: cp .env.example .env && php artisan key:generate

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      # Los tests usan FakeLlmClient: CI nunca llama a la API real ni necesita la key.
      - name: Tests
        run: vendor/bin/phpunit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [php, frontend]
    env:
      DB_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - name: Construir todas las imágenes
        run: docker compose build
