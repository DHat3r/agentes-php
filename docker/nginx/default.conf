# Gateway: sirve el frontend y reparte /qa, /tutor y /conciliacion a cada app PHP-FPM.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5m;

    # Frontend Vue (SPA).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /qa/api/stats llega a Laravel como /api/stats: el prefijo solo existe en el gateway.
    location ~ ^/qa(/.*)$ {
        include fastcgi_params;
        fastcgi_pass qa:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $1$is_args$args;
        fastcgi_read_timeout 120s;
    }

    location ~ ^/tutor(/.*)$ {
        include fastcgi_params;
        fastcgi_pass tutor:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $1$is_args$args;
        fastcgi_read_timeout 180s;
    }

    # La conciliación corre el agente dentro de la petición: puede tardar más.
    location ~ ^/conciliacion(/.*)$ {
        include fastcgi_params;
        fastcgi_pass conciliacion:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $1$is_args$args;
        fastcgi_read_timeout 300s;
    }
}
